<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#070b16;--panel:#0d1630;--line:#2a4a9c;--ink:#e6edff;--mute:#8a9ac4;--acc:#4da3ff;--gold:#ffc857;--ok:#5ee0b0;--bad:#ff6b81}

:root[data-theme="dark"]{--bg:#070b16;--panel:#0d1630;--line:#2a4a9c;--ink:#e6edff;--mute:#8a9ac4;--acc:#4da3ff;--gold:#ffc857;--ok:#5ee0b0;--bad:#ff6b81}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 17px/1.35 Rajdhani,system-ui,sans-serif;display:grid;grid-template-rows:1fr auto;overflow:hidden}
aside{order:2;display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--panel);border-top:1px solid var(--line);padding:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
aside::-webkit-scrollbar{display:none}
aside button{flex:0 0 calc(25% - 3px);scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:1px solid transparent;color:var(--mute);font:inherit;font-size:14px;padding:8px 2px;cursor:pointer}
aside button i{font-style:normal;font-size:20px;line-height:1}
aside button.on{color:var(--acc);border-color:var(--line);background:color-mix(in srgb,var(--acc) 10%,transparent)}
main{overflow:auto;padding:12px 12px 24px}
main>*{max-width:720px;margin-left:auto;margin-right:auto}
.win{background:var(--panel);border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));padding:16px;margin-bottom:14px;box-shadow:inset 0 0 24px color-mix(in srgb,var(--acc) 08%,transparent)}
h2{margin:0 0 10px;font-size:21px}
.top{display:grid;grid-template-columns:1fr}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.prof{display:flex;gap:14px;align-items:center}
.av{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--line);display:grid;place-items:center;font-size:36px;flex:none;border:2px solid var(--acc)}
.rank{width:54px;height:54px;border:2px solid var(--acc);color:var(--acc);display:grid;place-items:center;font-size:30px;font-weight:700;transform:rotate(45deg);margin:8px 10px 8px 6px;flex:none}
.rank span{transform:rotate(-45deg)}
.mute,small{color:var(--mute)}.gold{color:var(--gold)}
.bar{height:12px;background:color-mix(in srgb,var(--acc) 15%,transparent);margin:6px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--line),var(--acc));transition:width .5s}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal button{height:38px;background:none;border:1px solid transparent;color:var(--ink);font:inherit;cursor:pointer;position:relative}
.cal .hd{color:var(--mute);height:auto}
.cal .td{border-color:var(--gold);color:var(--gold)}
.cal .sel{background:var(--acc);color:var(--bg)}
.cal .dot::after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;background:var(--ok);border-radius:50%}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button{flex:1 1 auto;padding:9px 10px}
.tabs button,.ghost{background:none;border:1px solid var(--line);color:var(--mute);padding:9px 16px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--acc) 18%,transparent)}
.t{flex:1;min-width:0}.t b{display:block;overflow-wrap:anywhere}
.chk{width:38px;height:38px;flex:none;border:2px solid var(--acc);background:none;color:var(--ok);font-size:22px;cursor:pointer}
.done .t b{text-decoration:line-through;color:var(--mute)}
.chk.on{background:var(--acc);color:var(--bg)}
.btn{background:var(--acc);color:var(--bg);border:0;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.f{display:block;margin-bottom:10px}.f>span{display:block;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px;font:inherit}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.days{display:flex;gap:4px}.days label{flex:1;text-align:center;border:1px solid var(--line);padding:10px 0;cursor:pointer;color:var(--mute)}
.days input{display:none}.days label:has(input:checked){background:var(--acc);color:var(--bg)}
.chip{display:inline-block;border:1px solid var(--line);padding:1px 8px;margin:0 6px 4px 0;font-size:15px;color:var(--mute)}
.chip.bad{border-color:var(--bad);color:var(--bad)}.chip.gd{border-color:var(--gold);color:var(--gold)}
.ban{aspect-ratio:3/1;margin:-16px -16px 0;position:relative}
.art{height:96px;display:grid;place-items:center;font-size:54px;margin:-12px -12px 10px;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--acc) 35%,transparent),transparent 60%),linear-gradient(135deg,color-mix(in srgb,var(--acc) 25%,var(--panel)),var(--panel));overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.file{position:relative;overflow:hidden;cursor:pointer;display:inline-block}
.file input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.file:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.add{display:grid;grid-template-columns:1fr;gap:12px}
.ics{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.ics button{font-size:24px;height:42px;background:none;border:1px solid var(--line);cursor:pointer}
.ics .on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,transparent)}
.pf{display:grid;grid-template-columns:1fr;gap:10px}
.pf nav{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding-bottom:2px}.pf nav::-webkit-scrollbar{display:none}
.pf nav button{flex:0 0 auto;white-space:nowrap;scroll-snap-align:start}
.ov{position:fixed;inset:0;background:rgba(3,6,14,.78);display:grid;place-items:center;z-index:10;padding:14px}
.pu{width:min(760px,100%);max-height:100%;overflow:auto;position:relative;margin:0}
.x{position:absolute;top:8px;right:12px;background:none;border:0;color:var(--ink);font-size:28px;cursor:pointer;padding:6px 10px}
.pu .cols{display:grid;grid-template-columns:1fr;gap:12px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%) translateY(-120px);background:var(--panel);border:1px solid var(--acc);padding:10px 18px;z-index:20;transition:transform .3s;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.fx{position:fixed;inset:0;display:grid;place-items:center;z-index:30;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 35%,transparent),transparent 65%);animation:fxa 2.4s ease forwards}
.fx b{display:block;text-align:center;font-size:clamp(42px,12vw,90px);letter-spacing:.2em;color:var(--acc);text-shadow:0 0 24px var(--acc)}
.fx small{display:block;text-align:center;font-size:30px;color:var(--gold)}
.fx>div{animation:fxb 2.4s ease}
@keyframes fxa{0%{opacity:0}15%,75%{opacity:1}100%{opacity:0}}
@keyframes fxb{0%{transform:scale(.6)}20%{transform:scale(1.05)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.fx,.fx>div{animation:none}}
.kp{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-bottom:14px}
.kp .win{margin:0;padding:12px}.kp b{display:block;font-size:30px}
.gpill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:15;background:var(--panel);border:1px solid var(--acc);color:var(--acc);font:inherit;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.tb{width:100%;border-collapse:collapse;font-size:15px}.tb th,.tb td{padding:6px 4px;border-bottom:1px solid color-mix(in srgb,var(--acc) 18%,transparent);text-align:right}.tb th:first-child,.tb td:first-child{text-align:left}
.gmap{height:300px;border:1px solid var(--line);background:var(--bg);position:relative;overflow:hidden;margin-top:6px}
.gmap .leaflet-container,.leaflet-container{background:var(--bg);font:inherit}
.mapdark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.95) saturate(.55)}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--acc)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 80%,transparent)!important;color:var(--mute)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--acc)!important}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:440px}
.mood button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:68px;padding:4px 0;background:none;border:1px solid var(--line);color:var(--mute);cursor:pointer;font:inherit}
.mood span{font:30px/1 "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.mood small{font-size:13px}
.mood .on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}


/* ---- Visual v16 (canvas G-Line · componentes) ---- */
:root{--bg:#060a14;--panel:#0c1530;--line:#1e3a78;--ink:#e6edff;--mute:#8fa0c8;--acc:#4da3ff;--gold:#ffc857;--ok:#3ee0a0;--bad:#ff6b81}
:root[data-theme="dark"]{--bg:#060a14;--panel:#0c1530;--line:#1e3a78;--ink:#e6edff;--mute:#8fa0c8;--acc:#4da3ff;--gold:#ffc857;--ok:#3ee0a0;--bad:#ff6b81}
:root{--panel2:color-mix(in srgb,var(--panel) 70%,var(--bg));--fd:'Chakra Petch',Rajdhani,system-ui,sans-serif}
.win{clip-path:none;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
h2{font-family:var(--fd);font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--mute);font-weight:700;margin:0 0 12px}
.pu h2{font-size:22px;letter-spacing:.5px;text-transform:none;color:var(--ink)}
.pu>h2::before{content:"[ SISTEMA ]";display:block;font-size:11px;letter-spacing:4px;color:var(--acc);margin-bottom:6px}
.btn{border-radius:12px;min-height:44px;padding:10px 18px;font-family:var(--fd);letter-spacing:.5px}
.ghost{border-radius:12px;min-height:40px;background:var(--panel2);border-color:var(--line);color:color-mix(in srgb,var(--ink) 82%,var(--mute));font-weight:700}
.tabs{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{background:transparent;border:0;border-radius:10px;color:var(--mute);font-weight:700;min-height:38px}
.tabs button.on{background:var(--acc);color:var(--bg)}
.chip{border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--panel2)}
.chip.gd{background:color-mix(in srgb,var(--gold) 10%,var(--panel))}.chip.bad{background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.bar{height:8px;border-radius:999px;background:color-mix(in srgb,var(--acc) 14%,var(--panel))}
.bar i{border-radius:999px;background:var(--acc)}
.chk{width:34px;height:34px;border-radius:10px;font-size:18px;font-weight:700}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.item{border-top-color:color-mix(in srgb,var(--line) 70%,transparent)}
.item.qrow{border:1px solid var(--line);border-radius:16px;background:var(--panel2);padding:12px;margin-top:8px}
.item.qrow.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.item.qrow.sec{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--panel))}
.item.qrow.sec .chk.on{background:var(--gold);border-color:var(--gold)}
.item.qrow.opt{border-style:dashed;border-color:#4b3394}
.item.qrow.skp{opacity:.6}
input:not([type=checkbox]):not([type=color]):not([type=file]),select,textarea{border-radius:12px;background:var(--panel2);min-height:44px;padding:10px 14px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 1px var(--acc)}
.days label{border-radius:10px;background:var(--panel2)}
.rank{border-radius:10px;background:color-mix(in srgb,var(--acc) 10%,var(--panel));font-family:var(--fd)}
.prof b,.kp b,.gtm,#rt,#rd,#rp,.fx b{font-family:var(--fd)}
aside{background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);padding:6px}
aside button{border-radius:12px;font-weight:700}
aside button.on{background:color-mix(in srgb,var(--acc) 16%,transparent);border-color:transparent}
#toast{border-radius:999px;font-weight:700}
.ov{backdrop-filter:blur(3px)}
.cal button{border-radius:10px}
.mood button{border-radius:12px;background:var(--panel2)}
.win.pen{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--panel))}
.win.dg{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));background:color-mix(in srgb,var(--gold) 6%,var(--panel))}
.win.ret{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));background:color-mix(in srgb,var(--ok) 6%,var(--panel))}
.win.rec{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.win.rest{border-color:#4b3394;background:color-mix(in srgb,#a98bff 8%,var(--panel))}
.tabs button{flex:1 1 auto;padding:8px 10px;font-size:15px}
#toast{transform:translateX(-50%) translateY(calc(-100% - 40px))}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ---- Navegação v17: gaveta lateral, gaveta de apps ou barra clássica ---- */
#drw{display:contents}
body.navd{grid-template-rows:auto 1fr}body.navd aside{display:none}body.navc header#hdr{display:none}
header#hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 6px;background:var(--bg)}
.hb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--acc);display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.hav{width:44px;height:44px;border-radius:50%;border:2px solid var(--acc);background:var(--panel);color:var(--ink);font-family:var(--fd);font-weight:700;font-size:18px;cursor:pointer;flex:none;overflow:hidden;padding:0}

.hav{display:grid;place-items:center}
body.navd main{padding-bottom:96px}
.htl{text-align:center;min-width:0}.htl b{display:block;font-family:var(--fd);font-size:19px;letter-spacing:4px;color:var(--acc)}.htl small{font-size:12px;letter-spacing:2px;text-transform:uppercase}
.hdot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
#fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:58px;height:58px;border-radius:18px;border:0;background:var(--acc);color:var(--bg);display:grid;place-items:center;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer}
#fab[hidden]{display:none}
body.navd .gpill{top:calc(env(safe-area-inset-top,0px) + 66px)}
.dbk{position:fixed;inset:0;background:rgba(3,6,14,.72);z-index:40;animation:dfade .2s ease}
.dpn{position:fixed;top:0;left:0;bottom:0;width:min(312px,86vw);background:color-mix(in srgb,var(--panel) 80%,var(--bg));border-right:1px solid var(--line);z-index:41;display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);animation:dslide .22s ease;overflow-y:auto}
.dgr{position:fixed;inset:0;z-index:41;background:var(--bg);display:flex;flex-direction:column;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);animation:dfade .2s ease;overflow-y:auto}
@keyframes dslide{from{transform:translateX(-100%)}to{transform:none}}@keyframes dfade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.dbk,.dpn,.dgr{animation:none}}
.dpf{display:flex;align-items:center;gap:12px;padding:4px 4px 12px;border-bottom:1px solid var(--line)}
.dpf .hav{width:52px;height:52px;font-size:22px;cursor:default}
.dlb{font-family:var(--fd);font-size:12px;letter-spacing:3px;color:var(--mute);padding:10px 10px 2px}
.dit{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;border:0;background:none;color:color-mix(in srgb,var(--ink) 82%,var(--mute));font:inherit;font-size:17px;font-weight:600;text-align:left;cursor:pointer;width:100%}
.dit.on{background:color-mix(in srgb,var(--acc) 18%,var(--panel));color:var(--ink);font-weight:700}
.dit svg{flex:none;color:var(--acc)}
.dbg{margin-left:auto;min-width:22px;height:22px;border-radius:999px;background:var(--gold);color:var(--bg);font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.dft{margin-top:auto;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:12px 6px 0;font-size:14px;color:var(--mute)}
.dtl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dtl button{position:relative;height:96px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:color-mix(in srgb,var(--ink) 82%,var(--mute));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}

.navs button{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--mute);font:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:6px}
.navs button.on{border-color:var(--acc);color:var(--ink);background:color-mix(in srgb,var(--acc) 16%,var(--panel))}

</head>

<main id="app"></main>
<div id="pop"></div>
<div id="gt"></div>
<script>
const KEY='sistema-cacador-v2',DIAS=['D','S','T','Q','Q','S','S'],RK=['E','D','C','B','A','S'],TH=[1,10,20,35,50,75];
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CAT={saude:['Saúde',10],estudo:['Estudo',12],trabalho:['Trabalho',12],casa:['Casa',8],mente:['Mente',10],ar:['Ao ar livre',10]};
const SC={buff:'Buffs',game:'Games',comida:'Comidas',lazer:'Lazer',compras:'Compras',bem:'Bem-estar'};
const scOf=i=>i.sc||(i.type=='buff'?'buff':/jogo|game/i.test(i.t)?'game':/lanche|pizza|doce|sorvete|comida/i.test(i.t)?'comida':/tênis|roupa|compra/i.test(i.t)?'compras':'lazer');;

function gLeft(){const now=Date.now(),t0=parse(hoje()).getTime(),e=S.ses.run?(now-S.ses.run)/1000:0,et=S.ses.run?(now-Math.max(S.ses.run,t0))/1000:0;return{e,saldo:S.gs-e,hoje:dayLim()*60-(S.gp[hoje()]||0)*60-et}}
function fmtT(x){x=Math.max(0,Math.round(x));const h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')}
function gSettle(){if(!S.ses.run)return;const now=Date.now();let t=S.ses.run,used=0;
 while(t<now&&S.gs-used>0){const d=new Date(t),ds=fmt(d),end=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),seg=(Math.min(end,now)-t)/1000,e=Math.max(0,Math.min(seg,S.gs-used,limOf(ds)*60-(S.gp[ds]||0)*60));
  if(e>0){S.gp[ds]=(S.gp[ds]||0)+e/60;used+=e}t=end}
 S.gs=Math.max(0,S.gs-used);S.ses.sec+=used;S.ses.run=now}
function gStart(){if(S.ses.run)return;if(S.gs<1)return toast('Sem saldo de gameplay. Compre na Loja.');if(dayLim()*60-(S.gp[hoje()]||0)*60<1)return toast('Limite de gameplay de hoje atingido');if(!S.ses.on)S.ses={on:true,run:null,sec:0};S.ses.run=Date.now();save();render();toast('Sessão iniciada. Bom jogo!')}
function gPause(){gSettle();S.ses.run=null;save();render();toast('Sessão pausada')}
function gStop(){gSettle();const m=Math.round(S.ses.sec/60);if(S.ses.sec>0)led('gameplay','Sessão de gameplay: '+m+' min',0,0,{min:m});S.ses={on:false,run:null,sec:0};save();render();toast('Sessão encerrada: '+m+' min jogados')}
function gAlert(msg){try{navigator.vibrate&&navigator.vibrate([400,200,400,200,400])}catch(e){}
 try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},900)}catch(e){}
 modal('⏰ Tempo esgotado','<p>'+msg+'</p><p class="mute">Hora de voltar para as quests!</p>','<button class="btn" onclick="gStop();fechaMod()">Encerrar sessão</button>')}
function gtick(){if(!S.ses||!S.ses.run)return;const L=gLeft();
 if(L.saldo<=0||L.hoje<=0){gSettle();S.ses.run=null;save();render();gAlert(L.saldo<=0?'Seu saldo de gameplay acabou.':'Você atingiu o limite de gameplay de hoje.');return}
 const t=fmtT(Math.min(L.saldo,L.hoje));document.querySelectorAll('.gtm').forEach(e=>e.textContent=t);document.querySelectorAll('.gsd').forEach(e=>e.textContent=fmtT(L.saldo));document.querySelectorAll('.ghj').forEach(e=>e.textContent=fmtT(L.hoje))}
function gCard(){const L=gLeft(),run=!!S.ses.run;
 return `<div style="text-align:center;margin:4px 0 14px"><small>${run?'Jogando · tempo restante':'Saldo de gameplay'}</small><div class="gtm" style="font-size:46px;font-weight:700;line-height:1.1;color:${run?'var(--acc)':'var(--ink)'}">${fmtT(run?Math.min(L.saldo,L.hoje):S.gs)}</div><div class="row" style="justify-content:center;gap:14px;flex-wrap:wrap"><small>Saldo: <b class="gsd">${fmtT(L.saldo)}</b></small><small>Restante hoje: <b class="ghj">${fmtT(L.hoje)}</b></small></div>${run&&L.hoje<L.saldo?'<small style="color:var(--gold)">O limite de hoje termina antes do seu saldo.</small><br>':''}${S.ses.on?`<small>Nesta sessão: ${Math.round((S.ses.sec+(run?L.e:0))/60)} min</small>`:(S.gs<1?'<small>Compre tempo na Loja (categoria Games)</small>':'')}
 <div class="row" style="justify-content:center;gap:8px;margin-top:10px">${run?'<button class="btn" onclick="gPause()">⏸ Pausar</button>':`<button class="btn" ${S.gs<1?'disabled':''} onclick="gStart()">▶ ${S.ses.on?'Continuar':'Iniciar'}</button>`}${S.ses.on?'<button class="ghost" onclick="gStop()">⏹ Encerrar</button>':''}</div></div>`}

  else if(x.c=='corridas'){const i=S.runs.findIndex(r=>r.id==x.id);if(i>=0)S.runs[i]=v;else S.runs.unshift(v)}
  else if(x.c=='imagens'){if(x.id=='foto')S.photo=v.v;else S.bannerImg=v.v}
  SY.h[k]=h;chg=true});
 if(lg){S.lg.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));syRv()}
 if(chg){if((S.versao||0)<VER)S=migra(S);sySaveH();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();setSy('☁ Atualizado de outro aparelho')}}
function syReplace(R){const P=(c,id)=>{try{return JSON.parse(R[c][id].j)}catch(e){return null}},est=P('estado','principal');if(!est)return;const n=Object.assign(def(),est);
 n.quests=Object.keys(R.quests).map(id=>P('quests',id)).filter(Boolean);n.lg=Object.keys(R.historico).filter(id=>!R.historico[id].gen||!est.gen||R.historico[id].gen===est.gen).map(id=>P('historico',id)).filter(Boolean).sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
 n.diary={};Object.keys(R.diario).forEach(d=>{const v=P('diario',d);if(v)n.diary[d]=v});n.runs=Object.keys(R.corridas).map(id=>P('corridas',id)).filter(Boolean).sort((a,b)=>String(b.a).localeCompare(String(a.a)));
 n.photo=(P('imagens','foto')||{}).v||'';n.bannerImg=(P('imagens','banner')||{}).v||'';n.tab=S.tab;n.run=S.run;S=migra(n);syRv();
 SY.h={__uid:SY.u.uid};SYCOL.forEach(c=>Object.keys(R[c]).forEach(id=>{if(R[c][id].j)SY.h[c+'/'+id]=hs(R[c][id].j)}));sySaveH();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
async function syStart(u){SY.u=u;setSy('☁ Conectando…');syLoadH();if(SY.h.__uid&&SY.h.__uid!==u.uid)SY.h={};
 try{const R=await FBA.getAll(u.uid),has=R.estado&&R.estado.principal,used=S.total>0||S.quests.length>0||S.lg.length>1;
  if(!has){if(!S.gen)S.gen=uid();SY.h={__uid:u.uid};await syPush();toast('Seus dados foram enviados para a nuvem')}
  else if(SY.h.__uid===u.uid||!used){if(SY.h.__uid!==u.uid){syReplace(R);toast('Dados carregados da nuvem')}else{syApply(SYCOL.flatMap(c=>Object.keys(R[c]).map(id=>({c,id,data:R[c][id]}))));await syPush()}}
  else{const ce=JSON.parse(R.estado.principal.j);window.__SYR=R;return modal('Este aparelho já tem dados','<p>A nuvem e este aparelho têm progressos diferentes. Qual manter?</p><p class="mute">Nuvem: nível '+ce.lvl+', '+(ce.total||0)+' quests, alterado em '+(ce.ts?dt(ce.ts):'—')+'.<br>Este aparelho: nível '+S.lvl+', '+S.total+' quests, alterado em '+(S.ts?dt(S.ts):'—')+'.</p><p class="mute">Dica: exporte um backup antes de escolher.</p>','<button class="ghost" onclick="syUseDev()">Manter este aparelho</button><button class="btn" onclick="syUseCloud()">Usar os da nuvem</button>')}
  syListen()}catch(e){setSy('⚠ Não consegui conectar: '+((e&&e.message)||'erro'))}}
function syListen(){if(SY.un)SY.un();SY.un=FBA.listen(SY.u.uid,syApply);setSy('☁ Sincronizado')}
function syUseCloud(){MOD='';syReplace(window.__SYR);syListen();toast('Dados carregados da nuvem')}
async function syUseDev(){MOD='';const R=window.__SYR;S.gen=uid();SY.h={__uid:SY.u.uid};SYCOL.forEach(c=>{if(c!='historico')Object.keys(R[c]).forEach(id=>{SY.h[c+'/'+id]='x'})});S.ts=Date.now();save(true);render();await syPush();syListen();toast('A nuvem agora tem os dados deste aparelho')}
async function syLogin(){const m=fbOk();if(m)return toast(m);try{setSy('☁ Abrindo login…');await fbLoad();FBA.onUser(u=>{if(u&&(!SY.u||SY.u.uid!==u.uid))syStart(u);else if(!u){SY.u=null;setSy('');render()}});await FBA.login()}catch(e){setSy('');toast('Não consegui entrar: '+((e&&e.message)||'sem internet'))}}
async function syLogout(){if(!confirm('Sair da conta? Seus dados continuam neste aparelho, mas param de sincronizar.'))return;try{if(SY.un)SY.un();await FBA.logout()}catch(e){}SY.u=null;SY.h={};sySaveH();setSy('');render();toast('Você saiu da conta')}
function sySec(){const m=fbOk();return `<p style="margin-top:20px"><b>☁ Sincronização entre aparelhos</b></p>${m?`<small>${m}</small>`:SY.u?`<small style="display:block">Conectado como <b>${esc(SY.u.email||SY.u.name||'')}</b></small><small id="syst" style="display:block">${SY.st}</small><div class="row" style="justify-content:flex-start;gap:8px;margin-top:6px"><button class="ghost" onclick="syPush()">Sincronizar agora</button><button class="ghost" onclick="syLogout()">Sair</button></div>`:`<small style="display:block;margin-bottom:6px">Entre com a sua conta Google para ter o mesmo progresso no tablet e no celular. Faça o mesmo login em cada aparelho.</small><button class="btn" onclick="syLogin()">Entrar com Google</button><small id="syst" style="display:block">${SY.st}</small>`}`}
function ledFix(){const ck=ledCheck();if(!confirm('Ajustar XP, nível e ouro para bater com o histórico?'))return;S.gold=ck.sg;let l=1,x=ck.sx;while(x>=need(l)){x-=need(l);l++}S.lvl=l;S.xp=Math.max(0,x);save();render();toast('Contas ajustadas pelo histórico')}
function syAuto(){try{const h=JSON.parse(localStorage.getItem(KEY+'-sync')||'{}');if(!h.__uid||fbOk())return}catch(e){return}fbLoad().then(()=>FBA.onUser(u=>{if(u&&(!SY.u||SY.u.uid!==u.uid))syStart(u)})).catch(()=>setSy('⚠ Sem internet: sincroniza quando voltar'))}
window.addEventListener('online',()=>{if(SY.u)syPush();else syAuto()});
function dlTxt(name,text){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function bkTxt(){const d=S.lastExp?Math.floor((Date.now()-S.lastExp)/864e5):null;return (S.total>0||S.quests.length)&&(d===null||d>=7)?`<p style="color:var(--gold)">💾 ${d===null?'Você ainda não fez nenhum backup.':'Seu último backup foi há '+d+' dias.'} <button class="ghost" style="padding:4px 10px" onclick="exportar()">Exportar agora</button></p>`:''}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
function recScreen(){const snap=lsGet(KEY+'-snap'),sd=lsGet(KEY+'-snapd');document.getElementById('nav').innerHTML='';document.getElementById('pop').innerHTML=MOD||'';
 document.getElementById('app').innerHTML=`<section class="win pen"><h2>⚠ Não consegui ler seus dados</h2><p>Os dados salvos neste navegador parecem danificados. <b>Nada foi apagado</b>: o app entrou em modo seguro e não grava por cima.</p><p class="mute" style="font-size:13px;overflow-wrap:anywhere">Erro: ${esc(SAFE.err)}</p>
 <div style="display:grid;gap:8px;margin-bottom:10px"><button class="btn" onclick="dlTxt('g-line-dados-danificados.json',SAFE.raw)">⬇ Baixar os dados danificados</button>${snap?`<button class="btn" onclick="recSnap()">↩ Restaurar a cópia automática${sd?' de '+parse(sd).toLocaleDateString('pt-BR'):''}</button>`:''}<button class="ghost" onclick="document.getElementById('fk2').click()">⬆ Importar um backup</button><input id="fk2" class="vh" type="file" accept=".json,application/json" onchange="impLer(this)" tabindex="-1"><button class="ghost" onclick="recNew()">Começar do zero</button></div><small>Na dúvida, baixe os dados danificados e mande um print desta tela no chat.</small></section>`}
function recSnap(){try{const o=JSON.parse(lsGet(KEY+'-snap'));if(!o||!Array.isArray(o.quests||[]))throw 0;SAFE=null;S=migra(Object.assign(def(),o));save();render();toast('Cópia automática restaurada')}catch(e){toast('A cópia automática também está danificada')}}
function recNew(){if(confirm('Começar do zero? Uma cópia dos dados danificados continua guardada no navegador.')){SAFE=null;S=def();save();render()}}
function showErr(e){const m=(e&&(e.stack||e.message))||String(e),a=document.getElementById('app');if(!a)return;
 a.innerHTML=`<section class="win pen"><h2>Algo deu errado</h2><p>O app encontrou um erro ao mostrar esta tela. Seus dados continuam salvos.</p><p class="mute" style="font-size:13px;overflow-wrap:anywhere">${esc(m).slice(0,600)}</p><div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap"><button class="btn" onclick="try{exportar()}catch(x){alert('Não consegui exportar')}">⬇ Exportar backup</button><button class="ghost" onclick="S.tab='p';S.sub='s';POP=false;MOD='';render()">Voltar ao Painel</button></div><small>Mande um print desta tela no chat.</small></section>`}
window.addEventListener('error',e=>showErr(e.error||e.message));
if(!SAFE&&S.ts&&Date.now()<S.ts-6e5)setTimeout(()=>modal('⚠ Relógio do aparelho','<p>A data e a hora do aparelho estão <b>antes</b> da última alteração salva ('+dt(S.ts)+').</p><p class="mute">Confira o relógio do aparelho. Enquanto ele estiver atrasado, falhas, Dungeon e cronômetro podem ficar errados.</p>','<button class="btn" onclick="fechaMod()">Entendi</button>'),300);
let LASTD=hoje();setInterval(()=>{if(hoje()!=LASTD){LASTD=hoje();if(!MOD)render()}},30000);
render();setInterval(gtick,1000);syAuto();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
